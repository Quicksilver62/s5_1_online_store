import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.openapi.generator" version "7.12.0"
}

group = 'ru.yandex.practicum'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

tasks.register('buildClient', GenerateTask) {
	generatorName.set("java")
	inputSpec.set("$projectDir/src/main/resources/api-spec.yaml")
	outputDir.set("$projectDir/build/generated")
	ignoreFileOverride.set(".openapi-generator-java-sources.ignore")
	modelPackage.set("ru.yandex.practicum.client.domain")
	invokerPackage.set("ru.yandex.practicum.client")
	apiPackage.set("ru.yandex.practicum.client.api")
	configOptions.set([
			hideGenerationTimestamp: "true",
			library                : "webclient",
			useJakartaEe           : "true",
			useTags                : "true",
			openApiNullable        : "false",
			serializableModel      : "true"
	])
}

sourceSets.main.java.srcDir "$projectDir/build/generated/src/main/java"

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.2'
	implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.28'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:r2dbc'
	testImplementation 'com.redis:testcontainers-redis:2.2.2'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.hamcrest:hamcrest:3.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('compileJava') {
	dependsOn(tasks.buildClient)
}