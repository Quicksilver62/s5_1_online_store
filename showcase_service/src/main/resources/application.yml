server:
  port: 8080

spring:
  application:
    name: showcase-service
  datasource:
    url: r2dbc:postgresql://localhost:5432/store
    username: admin
    password: 12345
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cache:
    redis:
      time-to-live: PT1M

  sql:
    init:
      mode: always

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/online-store
            token-uri: http://localhost:8082/realms/online-store/protocol/openid-connect/token
        registration:
          yandex:
            provider: keycloak
            authorizationGrantType: client_credentials
            client-id: showcase-service
            client-secret: qFFgInZdbbI5RPkfhxCiXwz1NBZMAnzX
            scope: profile
            clientAuthenticationMethod: client_secret_post

payment:
  service:
    url: http://127.0.0.1:8081